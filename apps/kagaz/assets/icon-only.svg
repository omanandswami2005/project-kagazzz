<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#1c4a5e"/>
      <stop offset="100%" stop-color="#0f6e5c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1f33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Page, top-right corner folded (dog-ear), rounded elsewhere. -->
  <path
    d="M 346,272 L 602,272 L 702,372 L 702,728 Q 702,752 678,752 L 346,752 Q 322,752 322,728 L 322,296 Q 322,272 346,272 Z"
    fill="#ffffff"
    filter="url(#soft-shadow)"
  />
  <!-- Folded-corner flap (the underside of the fold). -->
  <path d="M 602,272 L 702,372 L 602,372 Z" fill="#c7d2de"/>

  <!-- Heading line + body lines (suggests written content). -->
  <rect x="372" y="372" width="200" height="28" rx="14" fill="#1e3a5f"/>
  <rect x="372" y="434" width="260" height="20" rx="10" fill="#c7d2de"/>
  <rect x="372" y="478" width="260" height="20" rx="10" fill="#c7d2de"/>
  <rect x="372" y="522" width="168" height="20" rx="10" fill="#c7d2de"/>

  <!-- Security badge, overlaid on the page's lower-right corner. -->
  <circle cx="662" cy="700" r="92" fill="#ffffff"/>
  <circle cx="662" cy="700" r="80" fill="#10b981"/>
  <path
    d="M 620,701 L 648,729 L 706,667"
    fill="none"
    stroke="#ffffff"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
