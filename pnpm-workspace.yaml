packages:
  - 'apps/*'
  - 'packages/*'
# Force a patched astro in the docs site (apps/docs→Starlight); stays within
# major 6. (undici is NOT overridden — jsdom@29 imports undici internals that
# moved in 7.28, so a bump breaks the test runtime; its advisories are ignored
# below with justification instead.)
overrides:
  astro: '>=6.4.6'
# Assessed-and-accepted advisories with no safe fix (see 10-security-architecture
# §dependency audit). None are exploitable in the shipped, offline V1 app.
auditConfig:
  ignoreGhsas:
    # SheetJS `xlsx` prototype-pollution + ReDoS — both in the *parsing* path.
    # F-42 only *generates* .xlsx from the user's own vault data (never parses
    # untrusted spreadsheets), lazy-loaded and fully offline; npm's latest is
    # 0.18.5 (SheetJS ships >0.18.5 only via its own CDN, off-limits offline).
    - GHSA-4r6h-8v6p-xvw6
    - GHSA-5pgg-2g8v-p4x9
    # undici TLS-bypass / WebSocket-DoS / request-routing — a DEV/TEST-only
    # transitive dep (vitest → jsdom → undici); never shipped in the offline app
    # and never makes a real network request in tests. Cannot bump: jsdom@29
    # depends on undici internals removed in the patched 7.28 line.
    - GHSA-vmh5-mc38-953g
    - GHSA-vxpw-j846-p89q
    - GHSA-hm92-r4w5-c3mj
    # node-tar path-traversal / hardlink / symlink advisories — all reached only
    # via pdfjs-dist's OPTIONAL `canvas` peer (Node-side/server PDF rendering;
    # this app renders PDFs only in the WebView, never on Node) →
    # @mapbox/node-pre-gyp → tar, used solely to unpack canvas's native binary
    # during an install-time build. `allowBuilds.canvas: false` above means
    # that build script — and therefore this tar extraction — never runs.
    - GHSA-34x7-hfp2-rc4v
    - GHSA-8qq5-rm4j-mr97
    - GHSA-83g3-92jg-28cx
    - GHSA-qffp-2rhf-9h96
    - GHSA-9ppj-qmqm-q256
    - GHSA-r6q2-hw4h-h46w
    - GHSA-vmf3-w455-68vh
    # minimatch ReDoS advisories — reached only via @capacitor/assets (app-icon
    # generation, docs/design-system/design-tokens.md#app-icon) →
    # @trapezedev/project → replace → minimatch. A devDependency that runs
    # locally, on-demand, against our own fixed SVG source paths — never
    # shipped, never invoked with attacker-controlled glob patterns.
    - GHSA-3ppc-4f35-3m26
    - GHSA-7r86-cg39-jmmj
    - GHSA-23c5-xmqv-rm74
allowBuilds:
  # Optional peer of pdfjs-dist@4.x for Node-side (server) rendering — Kagaz
  # only renders PDFs inside the WebView/browser, never on Node, so this
  # native build is unused. Denying it skips an unnecessary native compile.
  canvas: false
  esbuild: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@astrojs/starlight@0.40.0'
  - '@turbo/darwin-64@2.9.17'
  - '@turbo/darwin-arm64@2.9.17'
  - '@turbo/linux-64@2.9.17'
  - '@turbo/linux-arm64@2.9.17'
  - '@turbo/windows-64@2.9.17'
  - '@turbo/windows-arm64@2.9.17'
  - turbo@2.9.17
