packages:
  - 'apps/*'
  - 'packages/*'
# Patched floors for transitive dependencies. astro is a direct docs
# dependency on the patched 7.x line (2026-11-19). undici 7.30 works with
# jsdom 29 (the 7.28 internals break noted earlier no longer applies).
# No advisory is ignored any more: SheetJS `xlsx` was replaced by a JSZip
# writer, and every other finding has a patched version pinned here.
overrides:
  tar: '>=7.5.19'
  brace-expansion: '>=5.0.12'
  js-yaml: '>=4.3.2 <5.0.0'
  svgo: '>=4.1.0'
  sharp: '>=0.35.5'
  # 2026-11-19 audit sweep: patched floors for transitive advisories.
  # Capacitor GHSA-rvm3-566m-v7fv (critical, remote content load) is fixed in
  # 8.4.3; @aparajita/capacitor-biometric-auth carries its own Capacitor dep.
  '@capacitor/core': '^8.6.2'
  '@capacitor/android': '^8.6.2'
  '@capacitor/ios': '^8.6.2'
  # mammoth (DOCX import) pins the 0.8 line; @capacitor/assets the 0.9 line.
  '@xmldom/xmldom@<0.9.0': '^0.8.15'
  '@xmldom/xmldom@>=0.9.0-0': '^0.9.12'
  zod: '>=4.6.6'
  undici: '>=7.30.1 <8.0.0'
  vite@>=8.0.0 <8.1.6: '^8.1.6'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  fast-copy: '>=4.1.0'
  handlebars: '>=4.7.10'
  glob@>=9.0.0 <14.0.2: '^14.0.2'
  minimatch@>=7.0.0 <11.0.1: '^11.0.1'
  # `replace` (via @capacitor/assets) pins minimatch 3.0.5 exactly.
  minimatch@<3.1.4: '^3.1.5'
  uuid@<11.1.1: '^11.1.1'
  nanoid@<4.0.0: '^3.3.18'
  postcss: '>=8.5.23'
  postcss-selector-parser@<7.0.0: '^6.1.5'
  devalue: '>=5.9.3'
  smol-toml: '>=1.8.1'
  source-map-js: '>=1.2.2'
allowBuilds:
  # Optional peer of pdfjs-dist@4.x for Node-side (server) rendering — Kagaz
  # only renders PDFs inside the WebView/browser, never on Node, so this
  # native build is unused. Denying it skips an unnecessary native compile.
  canvas: false
  esbuild: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@astrojs/starlight@0.40.0'
  - '@turbo/darwin-64@2.9.17'
  - '@turbo/darwin-arm64@2.9.17'
  - '@turbo/linux-64@2.9.17'
  - '@turbo/linux-arm64@2.9.17'
  - '@turbo/windows-64@2.9.17'
  - '@turbo/windows-arm64@2.9.17'
  - turbo@2.9.17
  - '@astrojs/runtime@0.1.2'
  - astro@7.4.13
